<!DOCTYPE html>
<html lang="es">
<head>
  <meta charset="UTF-8" />
  <meta name="viewport" content="width=device-width, initial-scale=1.0, maximum-scale=1">
  <title>Miguelé</title>
  <link rel="icon" type="image/x-icon" href="Logotipo_Miguele.ico">
  <link rel="stylesheet" href="styles.css" />

  <style>
    @font-face {
      font-family: 'TimesNewRomanExtraBold';
      src: url('TimesNewRoman_ExtraBold.ttf') format('truetype');
    }

    body {
      margin: 0;
      padding: 0;
      background-color: black;
      color: white;
      font-family: 'Times New Roman', serif;
    }

    .hero {
      display: flex;
      align-items: center;
      justify-content: center;
      min-height: 100vh;
      padding: 2rem;
    }

    .left {
      flex: 1;
      display: flex;
      flex-direction: column;
      align-items: flex-start;
      justify-content: center;
      gap: 2rem;
    }

    .right {
      flex: 1;
      display: flex;
      align-items: center;
      justify-content: center;
    }

    .logo {
      max-width: 250px;
    }

    .laureles {
      display: flex;
      flex-direction: column;
      gap: 1rem;
    }

    .laureles img {
      max-width: 200px;
    }

    .foto {
      width: 100%;
      max-width: 500px;
      height: auto;
      border-radius: 10px;
    }

    /* ===== Menú hamburguesa móvil ===== */
    .menu-toggle {
      position: fixed;
      top: 20px;
      right: 20px;
      width: 30px;
      height: 25px;
      cursor: pointer;
      z-index: 1100;
      display: none;
      flex-direction: column;
      justify-content: space-between;
    }

    .menu-toggle span {
      display: block;
      height: 3px;
      width: 100%;
      background: white;
      transition: 0.3s;
    }

    .menu-toggle.active span:nth-child(1) {
      transform: rotate(45deg) translate(5px, 5px);
    }

    .menu-toggle.active span:nth-child(2) {
      opacity: 0;
    }

    .menu-toggle.active span:nth-child(3) {
      transform: rotate(-45deg) translate(5px, -5px);
    }

    .navbar ul {
      display: flex;
      gap: 2rem;
      list-style: none;
      padding: 0;
      margin: 0;
    }

    .navbar a {
      color: white;
      text-decoration: none;
      font-size: 1.1rem;
    }

    /* Fondo difuminado al abrir menú */
    body.menu-open {
      overflow: hidden;
    }

    body.menu-open::before {
      content: "";
      position: fixed;
      top: 0; left: 0; right: 0; bottom: 0;
      backdrop-filter: blur(8px);
      background: rgba(0, 0, 0, 0.4);
      z-index: 900;
    }

    /* Móvil */
    @media (max-width: 768px) {
      .menu-toggle {
        display: flex;
      }

      .navbar ul {
        display: none;
        position: fixed;
        top: 70px;
        right: 0;
        width: 100%;
        flex-direction: column;
        align-items: center;
        z-index: 1000;
      }

      .navbar ul.show {
        display: flex;
      }

      .navbar a {
        font-size: 1.5rem;
        padding: 1rem;
      }
    }
  </style>
</head>

<body>
  <header class="navbar">
    <div class="menu-toggle">
      <span></span>
      <span></span>
      <span></span>
    </div>
    <ul>
      <li><a href="#inicio">Inicio</a></li>
      <li><a href="#quien-soy">¿Quién soy?</a></li>
      <li><a href="#cita-a-ciegas">Cita a ciegas</a></li>
      <li><a href="#no-ver-para-creer">No ver para creer</a></li>
      <li><a href="#contacto">Contacto</a></li>
    </ul>
  </header>

  <!-- ======== SECCIONES ======== -->

  <section id="inicio" class="hero">
    <div class="left">
      <img src="Logotipo_Miguele.png" alt="Logotipo Miguele" class="logo" />
      <div class="laureles">
        <img src="Premio_Nacional_Miguele.png" alt="Premio Nacional" />
        <img src="Premio_Rioboo_Miguele.png" alt="Premio Rioboo" />
      </div>
    </div>
    <div class="right">
      <img src="Miguele_alta_calidad_foto_Pablo_Ibanez_255.jpg" alt="Miguele" class="foto" />
    </div>
  </section>

  <!-- (Las secciones “¿Quién soy?”, “Cita a ciegas”, “No ver para creer” y “Contacto” se mantienen igual) -->
  <!-- No hace falta tocar nada de esas partes. -->

  <script>
    const menuToggle = document.querySelector(".menu-toggle");
    const navbarMenu = document.querySelector(".navbar ul");
    const body = document.body;

    // Abrir/cerrar menú al tocar la hamburguesa
    menuToggle.addEventListener("click", () => {
      const isOpen = navbarMenu.classList.toggle("show");
      menuToggle.classList.toggle("active", isOpen);
      body.classList.toggle("menu-open", isOpen);
    });

    // Cerrar menú al pulsar un enlace
    document.querySelectorAll(".navbar a").forEach(link => {
      link.addEventListener("click", () => {
        navbarMenu.classList.remove("show");
        menuToggle.classList.remove("active");
        body.classList.remove("menu-open");
      });
    });
  </script>
</body>
</html>
